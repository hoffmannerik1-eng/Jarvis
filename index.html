<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOVS AI</title>

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0d;
  --panel2:#101012;
  --panel3:#151517;
  --line:#27272b;
  --red:#ff2638;
  --red2:#b80015;
  --redGlow:rgba(255,38,56,.22);
  --text:#f4f4f5;
  --muted:#8b8b92;
  --green:#43e58b;
  --blue:#4da3ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:235px 1fr 390px;
  grid-template-rows:64px 1fr;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,38,56,.11),transparent 30%),
    #050505;
}

/* =========================
   HEADER
========================= */

.header{
  grid-column:1/4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(5,5,6,.92);
  backdrop-filter:blur(18px);
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:4px;
}

.logoCore{
  width:34px;
  height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,white 0 5%,transparent 7%),
    radial-gradient(circle,var(--red) 0%,#62000b 45%,#070000 72%);
  box-shadow:
    0 0 15px var(--redGlow),
    0 0 45px rgba(255,38,56,.12);
  animation:orb 2.7s infinite;
}

@keyframes orb{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.headerCenter{
  display:flex;
  align-items:center;
  gap:10px;
}

.status{
  font-size:11px;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid rgba(255,38,56,.25);
  color:#ff6d78;
  background:rgba(255,38,56,.06);
}

.headerButtons{
  display:flex;
  gap:7px;
}

.topBtn{
  border:1px solid var(--line);
  background:#0d0d0f;
  color:#c8c8cc;
  border-radius:8px;
  padding:8px 10px;
  transition:.2s;
}

.topBtn:hover{
  color:white;
  border-color:rgba(255,38,56,.5);
  box-shadow:0 0 15px rgba(255,38,56,.08);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  min-width:0;
  overflow:auto;
  border-right:1px solid var(--line);
  background:#080809;
  padding:15px;
}

.sectionTitle{
  color:#66666d;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
  margin:12px 5px 9px;
}

.navItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:9px;
  color:#9999a0;
  cursor:pointer;
  margin-bottom:4px;
  transition:.2s;
}

.navItem:hover{
  background:#111113;
  color:white;
}

.navItem.active{
  color:#fff;
  background:linear-gradient(
    90deg,
    rgba(255,38,56,.16),
    transparent
  );
  border-left:2px solid var(--red);
}

.navIcon{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  background:#121214;
  border-radius:7px;
}

.projectItem{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  border-radius:8px;
  color:#929298;
  cursor:pointer;
}

.projectItem:hover{
  background:#111113;
  color:white;
}

.projectItem.active{
  color:#ff6570;
  background:rgba(255,38,56,.07);
}

.newProject{
  width:100%;
  margin-top:8px;
  padding:9px;
  border-radius:8px;
  border:1px dashed rgba(255,38,56,.3);
  background:transparent;
  color:#ff5664;
}

/* =========================
   CENTER
========================= */

.center{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#070708;
}

.centerTop{
  height:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
}

.breadcrumb{
  color:#77777e;
  font-size:11px;
}

.workspaceButtons{
  display:flex;
  gap:6px;
}

.smallBtn{
  border:1px solid var(--line);
  background:#0e0e10;
  color:#aaaab0;
  border-radius:7px;
  padding:7px 9px;
}

.smallBtn:hover{
  color:white;
  border-color:rgba(255,38,56,.45);
}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.codePanel,
.previewPanel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.codePanel{
  border-right:1px solid var(--line);
}

.panelTitle{
  height:35px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid var(--line);
  color:#696970;
  font-size:9px;
  letter-spacing:1.5px;
  font-weight:800;
}

#editor{
  flex:1;
  width:100%;
  resize:none;
  outline:0;
  border:0;
  background:#050506;
  color:#dedee2;
  padding:15px;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:12px;
  line-height:1.65;
}

#preview{
  width:100%;
  flex:1;
  border:0;
  background:white;
}

/* =========================
   CHAT
========================= */

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  background:#09090a;
}

.chatTop{
  height:48px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid var(--line);
}

.agentTitle{
  display:flex;
  align-items:center;
  gap:8px;
}

.agentDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px var(--red);
}

.agentBadge{
  font-size:9px;
  letter-spacing:1px;
  padding:5px 7px;
  border-radius:999px;
  color:#ff6974;
  border:1px solid rgba(255,38,56,.25);
  background:rgba(255,38,56,.05);
}

.messages{
  flex:1;
  overflow:auto;
  padding:14px;
}

.msg{
  margin-bottom:13px;
  animation:message .2s ease;
}

@keyframes message{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.msg.user{
  display:flex;
  justify-content:flex-end;
}

.bubble{
  max-width:91%;
  padding:10px 12px;
  border-radius:12px;
  font-size:12px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.msg.ai .bubble{
  background:#111113;
  border:1px solid #232327;
}

.msg.user .bubble{
  background:rgba(255,38,56,.13);
  border:1px solid rgba(255,38,56,.2);
}

.action{
  margin-top:6px;
  padding:7px 9px;
  border-left:2px solid var(--red);
  background:#0d0d0f;
  color:#77777f;
  font-family:monospace;
  font-size:10px;
}

.action.ok{
  color:#83e6aa;
  border-color:var(--green);
}

.action.err{
  color:#ff737d;
  border-color:var(--red);
}

.generatedImage{
  max-width:100%;
  display:block;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #28282c;
  cursor:pointer;
}

.chatBottom{
  flex-shrink:0;
  padding:11px;
  border-top:1px solid var(--line);
}

.quick{
  display:flex;
  gap:5px;
  overflow:auto;
  margin-bottom:8px;
}

.quick button{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#101012;
  color:#7f7f86;
  padding:6px 8px;
  border-radius:999px;
  font-size:9px;
}

.inputRow{
  display:flex;
  gap:6px;
}

#input{
  flex:1;
  min-width:0;
  border:1px solid #29292d;
  outline:0;
  border-radius:10px;
  background:#111113;
  color:white;
  padding:11px;
}

#input:focus{
  border-color:rgba(255,38,56,.5);
  box-shadow:0 0 0 3px rgba(255,38,56,.05);
}

.iconBtn{
  width:42px;
  flex-shrink:0;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111113;
  color:#aaaab0;
}

.iconBtn:hover{
  color:white;
  border-color:rgba(255,38,56,.5);
}

.iconBtn.active{
  background:#5d0c16;
  color:#ff7c86;
  border-color:#a81627;
}

.sendBtn{
  width:43px;
  border:0;
  border-radius:10px;
  background:var(--red);
  color:white;
  font-weight:900;
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  z-index:100;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);
}

.card{
  width:min(520px,92vw);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:17px;
  border:1px solid #333338;
  background:#0c0c0e;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.card h2{
  margin:0 0 7px;
}

.card p{
  color:#7d7d84;
  font-size:12px;
  line-height:1.5;
}

.card input,
.card select{
  width:100%;
  margin-top:9px;
  padding:11px;
  border-radius:8px;
  border:1px solid #29292d;
  background:#050506;
  color:white;
  outline:0;
}

.modalButtons{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.modalButtons button{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#151517;
  color:white;
}

.modalButtons .primary{
  border:0;
  background:var(--red);
}

/* IMAGE GALLERY */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:12px;
}

.gallery img{
  width:100%;
  border-radius:9px;
}

/* RESPONSIVE */

@media(max-width:1150px){
  .app{
    grid-template-columns:200px 1fr 340px;
  }
}

@media(max-width:950px){
  .app{
    grid-template-columns:190px 1fr;
  }

  .chat{
    display:none;
  }

  .header{
    grid-column:1/3;
  }
}

@media(max-width:700px){
  .app{
    grid-template-columns:1fr;
    grid-template-rows:58px 1fr;
  }

  .sidebar{
    display:none;
  }

  .header{
    grid-column:1;
  }

  .headerCenter,
  .headerButtons{
    display:none;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .previewPanel{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

  <div class="logo">
    <div class="logoCore"></div>
    JOVS
  </div>

  <div class="headerCenter">
    <div class="status" id="status">● BEREIT</div>
  </div>

  <div class="headerButtons">
    <button class="topBtn" onclick="openGoogle()">Google</button>
    <button class="topBtn" onclick="openYouTube()">YouTube</button>
    <button class="topBtn" onclick="openMaps()">Maps</button>
    <button class="topBtn" onclick="openSettings()">⚙ API</button>
  </div>

</header>


<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="sectionTitle">JOVS</div>

  <div class="navItem active" onclick="showHome()">
    <div class="navIcon">⌂</div>
    <span>Agent</span>
  </div>

  <div class="navItem" onclick="quickCommand('Erstelle ein Bild von')">
    <div class="navIcon">▧</div>
    <span>Bilder</span>
  </div>

  <div class="navItem" onclick="quickCommand('Erstelle ein beeindruckendes 3D-Modell von')">
    <div class="navIcon">◇</div>
    <span>3D Studio</span>
  </div>

  <div class="navItem" onclick="quickCommand('Baue ein komplettes Projekt für')">
    <div class="navIcon">⌘</div>
    <span>Builder</span>
  </div>

  <div class="navItem" onclick="runPreview()">
    <div class="navIcon">▶</div>
    <span>Preview</span>
  </div>


  <div class="sectionTitle">PROJEKTE</div>

  <div id="projects"></div>

  <button class="newProject" onclick="newProject()">
    + Neues Projekt
  </button>


  <div class="sectionTitle">DATEIEN</div>

  <div id="files"></div>

</aside>


<!-- CENTER -->

<main class="center">

  <div class="centerTop">

    <div class="breadcrumb" id="breadcrumb">
      JOVS / index.html
    </div>

    <div class="workspaceButtons">
      <button class="smallBtn" onclick="runPreview()">▶</button>
      <button class="smallBtn" onclick="saveProject()">Speichern</button>
      <button class="smallBtn" onclick="downloadFile()">Export</button>
    </div>

  </div>


  <div class="workspace">

    <section class="codePanel">

      <div class="panelTitle">
        CODE
      </div>

      <textarea
        id="editor"
        spellcheck="false"
      ></textarea>

    </section>


    <section class="previewPanel">

      <div class="panelTitle">
        LIVE PREVIEW
      </div>

      <iframe id="preview"></iframe>

    </section>

  </div>

</main>


<!-- CHAT -->

<section class="chat">

  <div class="chatTop">

    <div class="agentTitle">
      <div class="agentDot"></div>
      <strong>JOVS Agent</strong>
    </div>

    <div class="agentBadge">
      ONLINE
    </div>

  </div>


  <div class="messages" id="messages"></div>


  <div class="chatBottom">

    <div class="quick">
      <button onclick="quickCommand('Erstelle ein Bild von einem futuristischen Auto')">
        🖼 Bild
      </button>

      <button onclick="quickCommand('Erstelle ein 3D-Modell von einem futuristischen Auto')">
        ◇ 3D
      </button>

      <button onclick="quickCommand('Baue ein cooles Browser-Spiel')">
        🎮 Spiel
      </button>

      <button onclick="quickCommand('Verbessere das Design dieses Projekts')">
        ✦ Design
      </button>
    </div>


    <div class="inputRow">

      <button
        class="iconBtn"
        id="mic"
        onclick="toggleMic()"
      >
        🎙
      </button>

      <input
        id="input"
        placeholder="Sag JOVS, was er machen soll..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter')sendMessage()"
      >

      <button
        class="sendBtn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</section>

</div>


<!-- SETTINGS -->

<div class="modal" id="settings">

  <div class="card">

    <h2>JOVS Einstellungen</h2>

    <p>
      Dein Gemini-Key wird nur lokal in diesem Browser
      gespeichert. Für eine öffentlich veröffentlichte
      Website wäre ein Backend sicherer.
    </p>

    <input
      id="apiKey"
      type="password"
      placeholder="Gemini API Key"
    >

    <select id="imageSize">
      <option value="1K">Bilder – 1K</option>
      <option value="2K">Bilder – 2K</option>
      <option value="4K">Bilder – 4K</option>
    </select>

    <select id="aspect">
      <option value="1:1">Bild – 1:1</option>
      <option value="16:9">Bild – 16:9</option>
      <option value="9:16">Bild – 9:16</option>
      <option value="4:3">Bild – 4:3</option>
      <option value="3:4">Bild – 3:4</option>
      <option value="21:9">Bild – 21:9</option>
    </select>

    <div class="modalButtons">
      <button onclick="closeSettings()">Schließen</button>
      <button class="primary" onclick="saveSettings()">Speichern</button>
    </div>

  </div>

</div>


<script>

/* ==========================================================
   JOVS CONFIG
========================================================== */

const TEXT_MODEL = "gemini-3.8-flash";
const IMAGE_MODEL = "gemini-3.1-flash-image";

const KEY_NAME = "jovs_gemini_key";
const PROJECT_NAME = "jovs_projects";

let apiKey =
  localStorage.getItem(KEY_NAME) || "";

let imageSize =
  localStorage.getItem("jovs_image_size") || "1K";

let aspectRatio =
  localStorage.getItem("jovs_aspect") || "1:1";

let currentProject = "JOVS";
let currentFile = "index.html";

let listening = false;
let recognition = null;

let history = [];

let projects =
  JSON.parse(
    localStorage.getItem(PROJECT_NAME) || "null"
  );


/* ==========================================================
   DEFAULT PROJECT
========================================================== */

if(!projects){

  projects = {

    JOVS:{
      files:{
        "index.html":`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mein JOVS Projekt</title>
<style>
body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:#050505;
color:#ff2638;
font-family:Arial;
}
h1{
font-size:70px;
}
</style>
</head>
<body>
<h1>JOVS</h1>
</body>
</html>
`
      }
    },

    GameZone:{
      files:{
        "index.html":`
<!DOCTYPE html>
<html>
<body style="
margin:0;
background:#050505;
color:white;
font-family:Arial;
text-align:center;
padding:100px
">
<h1>GameZone</h1>
<p>Dein nächstes Spiel.</p>
</body>
</html>
`
      }
    }

  };

  saveProjects();

}


/* ==========================================================
   STORAGE
========================================================== */

function saveProjects(){

  localStorage.setItem(
    PROJECT_NAME,
    JSON.stringify(projects)
  );

}


/* ==========================================================
   PROJECT UI
========================================================== */

function renderProjects(){

  const box =
    document.getElementById("projects");

  box.innerHTML="";

  Object.keys(projects)
    .forEach(name=>{

      const item =
        document.createElement("div");

      item.className =
        "projectItem " +
        (name===currentProject
          ?"active":"");

      item.innerHTML =
        "▣ <span>" +
        escapeHTML(name) +
        "</span>";

      item.onclick=()=>{

        currentProject=name;

        const files =
          Object.keys(
            projects[name].files
          );

        currentFile =
          files.includes("index.html")
            ?"index.html"
            :files[0];

        renderAll();

      };

      box.appendChild(item);

    });

}


function renderFiles(){

  const box =
    document.getElementById("files");

  box.innerHTML="";

  Object.keys(
    projects[currentProject].files
  ).forEach(path=>{

    const item =
      document.createElement("div");

    item.className =
      "projectItem " +
      (path===currentFile
        ?"active":"");

    item.innerHTML =
      "📄 <span>" +
      escapeHTML(path) +
      "</span>";

    item.onclick=()=>{

      currentFile=path;

      loadFile();

      renderFiles();

    };

    box.appendChild(item);

  });

}


function renderAll(){

  renderProjects();
  renderFiles();
  loadFile();

}


/* ==========================================================
   EDITOR
========================================================== */

function loadFile(){

  const content =
    projects[currentProject]
      .files[currentFile] || "";

  document.getElementById("editor")
    .value=content;

  document.getElementById("breadcrumb")
    .textContent =
      currentProject +
      " / " +
      currentFile;

  runPreview();

}


document
.getElementById("editor")
.addEventListener(
  "input",
  ()=>{

    projects[currentProject]
      .files[currentFile] =
        document.getElementById("editor")
          .value;

    saveProjects();

  }
);


/* ==========================================================
   PROJECT
========================================================== */

function newProject(){

  const name =
    prompt("Name des Projekts:");

  if(!name) return;

  if(projects[name]){

    alert("Projekt existiert bereits.");

    return;

  }

  projects[name]={
    files:{
      "index.html":
`<!DOCTYPE html>
<html>
<head>
<title>${escapeHTML(name)}</title>
</head>
<body>
<h1>${escapeHTML(name)}</h1>
</body>
</html>`
    }
  };

  currentProject=name;
  currentFile="index.html";

  saveProjects();
  renderAll();

}


function saveProject(){

  projects[currentProject]
    .files[currentFile] =
      document.getElementById("editor")
        .value;

  saveProjects();

  action("Projekt gespeichert","ok");

}


function downloadFile(){

  const code =
    projects[currentProject]
      .files[currentFile];

  const blob =
    new Blob(
      [code],
      {type:"text/html"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;
  a.download=
    currentFile.split("/").pop();

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

}


/* ==========================================================
   PREVIEW
========================================================== */

function runPreview(){

  const code =
    document.getElementById("editor")
      .value;

  document.getElementById("preview")
    .srcdoc=code;

}


/* ==========================================================
   CHAT UI
========================================================== */

function message(text,type="ai"){

  const row =
    document.createElement("div");

  row.className =
    "msg " + type;

  const bubble =
    document.createElement("div");

  bubble.textContent=text;

  row.appendChild(bubble);

    .getElementById("messages")

}

}

}


function quickCommand(text){

    .value=text;

  sendMessage();

/* ==========================================================
   MAIN CHAT
========================================================== */

async function sendMessage(){

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if(!text) return;

  input.value="";

  message(text,"user");

  if(!apiKey){

    message(
      "Bitte zuerst unter ⚙ API deinen Gemini-Key eintragen."
    );

    openSettings();

    return;

  }

  setStatus("DENKEN");

  try{

    /* IMAGE REQUEST */

    if(isImageRequest(text)){

      await handleImage(text);

      setStatus("BEREIT");

      return;

    }


    /* 3D REQUEST */

    if(is3DRequest(text)){

      await handle3D(text);

      setStatus("BEREIT");

      return;

    }


    /* NORMAL AGENT */

    action(
      "JOVS analysiert die Aufgabe..."
    );

    const result =
      await askAgent(text);

    if(result.reply){

      message(
        result.reply
      );

      speak(result.reply);

    }

    if(
      Array.isArray(result.actions)
    ){

      for(
        const a of result.actions
      ){

        await execute(a);

      }

    }

    history.push({
      role:"user",
      text:text
    });

    history.push({
      role:"assistant",
      text:result.reply || ""
    });

    if(history.length>12){

      history=
        history.slice(-12);

    }

    setStatus("BEREIT");

  }catch(error){

    console.error(error);

    action(
      "Fehler: " + error.message,
      "err"
    );

    message(
      "Das hat nicht funktioniert: " +
      error.message
    );

    setStatus("FEHLER");

  }

}


/* ==========================================================
   IMAGE DETECTION
========================================================== */

function isImageRequest(text){

  const t =
    text.toLowerCase();

  const words=[
    "erstelle ein bild",
    "erstelle mir ein bild",
    "mach ein bild",
    "mach mir ein bild",
    "generiere ein bild",
    "generiere mir ein bild",
    "zeichne ein bild",
    "bild erstellen",
    "bild generieren",
    "generiere ein foto",
    "mach ein foto"
  ];

  return words.some(
    x=>t.includes(x)
  );

}


/* ==========================================================
   IMAGE GENERATION
========================================================== */

async function handleImage(prompt){

  action(
    "Bildgenerator wird gestartet..."
  );

  const endpoint =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    IMAGE_MODEL +
    ":generateContent";


  const response =
    await fetch(
      endpoint,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "x-goog-api-key":
            apiKey
        },

        body:JSON.stringify({

          contents:[
            {
              parts:[
                {
                  text:
                    "Erzeuge genau das gewünschte Bild. " +
                    "Keine zusätzliche Erklärung. " +
                    prompt
                }
              ]
            }
          ],

          generationConfig:{

            responseModalities:[
              "IMAGE"
            ],

            responseFormat:{
              image:{
                aspectRatio:
                  aspectRatio,

                imageSize:
                  imageSize
              }
            }

          }

        })

      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "Bild-API Fehler"
    );

  }


  const parts =
    data?.candidates?.[0]
      ?.content?.parts || [];


  let found=false;

  for(
    const part of parts
  ){

    if(
      part.inlineData &&
      part.inlineData.data
    ){

      found=true;

      imageMessage(
        part.inlineData.data
      );

    }

  }


  if(!found){

    throw new Error(
      "Das Bildmodell hat kein Bild zurückgegeben."
    );

  }


  action(
    "Bild wurde erstellt.",
    "ok"
  );

}


/* ==========================================================
   3D DETECTION
========================================================== */

function is3DRequest(text){

  const t =
    text.toLowerCase();

  return(
    t.includes("3d") &&
    (
      t.includes("modell") ||
      t.includes("model") ||
      t.includes("szene") ||
      t.includes("objekt") ||
      t.includes("erstell") ||
      t.includes("bau") ||
      t.includes("mach")
    )
  );

}


/* ==========================================================
   3D GENERATION
========================================================== */

async function handle3D(prompt){

  action(
    "JOVS baut ein neues 3D-Modell..."
  );

  const request =
`Erstelle eine vollständige interaktive
3D-Webszene für diese Aufgabe:

${prompt}

Verwende Three.js per CDN.
Erstelle eine hochwertige Szene mit:
- Kamera
- Beleuchtung
- Materialien
- Schatten wenn sinnvoll
- Boden/Umgebung
- Animation
- Maussteuerung
- Touchsteuerung
- responsive Darstellung

Gib ausschließlich den vollständigen HTML-Code zurück.
Keine Markdown-Codeblöcke.`;


  const html =
    await askText(
      request
    );


  const clean =
    cleanCode(html);


  const path =
    "3d/" +
    safeName(
      prompt.substring(0,45)
    ) +
    ".html";


  projects[currentProject]
    .files[path]=clean;

  currentFile=path;

  saveProjects();
  renderAll();

  action(
    "3D-Modell erstellt: " + path,
    "ok"
  );

}


/* ==========================================================
   AGENT
========================================================== */

async function askAgent(userText){

  const files =
    Object.keys(
      projects[currentProject].files
    );

  const current =
    projects[currentProject]
      .files[currentFile] || "";


  const system = `

Du bist JOVS, ein autonomer KI-Agent für
Programmierung, Webseiten, Spiele, 3D und Projekte.

Antworte immer auf Deutsch.

JOVS kann:

- Dateien erstellen
- Dateien bearbeiten
- Dateien löschen
- komplette Projekte bauen
- Webseiten bauen
- Spiele bauen
- 3D-Projekte bauen
- JOVS-Projekte verändern
- UI verändern
- Preview starten
- Google öffnen
- YouTube öffnen
- Maps öffnen
- Webseiten öffnen
- Projekte speichern

Wenn der Nutzer sagt, dass etwas gebaut,
geändert oder erstellt werden soll, führe die
Aktionen tatsächlich aus.

Wenn eine bestehende Datei geändert wird,
liefere den kompletten neuen Inhalt.

Wenn ein komplettes Projekt gebaut wird,
verwende build_project und liefere alle Dateien.

Wenn der Nutzer JOVS selbst verändern möchte,
darfst du das aktuelle Projekt bearbeiten.

WICHTIG:
Keine API-Keys in Dateien schreiben.

AKTUELLES PROJEKT:
${currentProject}

AKTUELLE DATEI:
${currentFile}

DATEIEN:
${files.join(", ")}

AKTUELLER CODE:
-----START-----
${current}
-----END-----

Antworte ausschließlich als JSON.

Format:

{
  "reply":"kurze Antwort",
  "actions":[
    {
      "type":"edit_file",
      "path":"index.html",
      "content":"vollständiger Code"
    }
  ]
}

Erlaubte action types:

edit_file
create_file
delete_file
build_project
preview
save_project
open_google
open_youtube
open_maps
open_website
change_ui

Für build_project:

{
"type":"build_project",
"files":[
  {
    "path":"index.html",
    "content":"..."
  },
  {
    "path":"style.css",
    "content":"..."
  }
]
}

`;


  const prompt =
    system +
    "\n\nBisheriger Chat:\n" +
    history.map(
      x=>x.role+": "+x.text
    ).join("\n") +
    "\n\nNeue Aufgabe:\n" +
    userText;


  const raw =
    await askText(prompt);


  let parsed;

  try{

    parsed =
      JSON.parse(
        cleanJSON(raw)
      );

  }catch{

    return{
      reply:raw,
      actions:[]
    };

  }

  return parsed;

}


/* ==========================================================
   TEXT REQUEST
========================================================== */

async function askText(prompt){

  const endpoint =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    TEXT_MODEL +
    ":generateContent";


  const response =
    await fetch(
      endpoint,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "x-goog-api-key":
            apiKey
        },

        body:JSON.stringify({

          contents:[
            {
              role:"user",
              parts:[
                {
                  text:prompt
                }
              ]
            }
          ],

          generationConfig:{
            temperature:.2,
            responseMimeType:
              "application/json"
          }

        })
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "Gemini Fehler"
    );

  }


  return (
    data?.candidates?.[0]
      ?.content?.parts?.[0]?.text
    || ""
  );

}


/* ==========================================================
   ACTION EXECUTION
========================================================== */

async function execute(a){

  if(!a || !a.type)
    return;


  action(
    "→ " + a.type
  );


  switch(a.type){

    case "edit_file":

      if(
        a.path &&
        typeof a.content==="string"
      ){

        projects[currentProject]
          .files[a.path]=a.content;

        currentFile=a.path;

        saveProjects();
        renderAll();

        action(
          "Datei geändert: "+a.path,
          "ok"
        );

      }

      break;


    case "create_file":

      if(a.path){

        projects[currentProject]
          .files[a.path]=
            a.content || "";

        currentFile=a.path;

        saveProjects();
        renderAll();

        action(
          "Datei erstellt: "+a.path,
          "ok"
        );

      }

      break;


    case "delete_file":

      if(
        a.path &&
        projects[currentProject]
          .files[a.path]
      ){

        delete projects[currentProject]
          .files[a.path];

        const files =
          Object.keys(
            projects[currentProject].files
          );

        currentFile =
          files[0] || "";

        saveProjects();
        renderAll();

        action(
          "Datei gelöscht: "+a.path,
          "ok"
        );

      }

      break;


    case "build_project":

      if(
        Array.isArray(a.files)
      ){

        for(
          const file of a.files
        ){

          if(
            file.path &&
            typeof file.content==="string"
          ){

            projects[currentProject]
              .files[file.path]=
                file.content;

            action(
              "Baue "+file.path
            );

          }

        }

        if(a.files.length){

          currentFile =
            a.files[0].path;

        }

        saveProjects();
        renderAll();

        action(
          "Projekt fertig gebaut.",
          "ok"
        );

      }

      break;


    case "preview":

      runPreview();

      action(
        "Preview aktualisiert.",
        "ok"
      );

      break;


    case "save_project":

      saveProject();

      break;


    case "open_google":

      openGoogle(
        a.query || ""
      );

      break;


    case "open_youtube":

      openYouTube(
        a.query || ""
      );

      break;


    case "open_maps":

      openMaps(
        a.query || ""
      );

      break;


    case "open_website":

      if(a.url){

        openWebsite(a.url);

      }

      break;


    case "change_ui":

      applyUIChange(
        a.instruction || ""
      );

      break;

  }

}


/* ==========================================================
   UI CHANGES
========================================================== */

function applyUIChange(text){

  const t=
    text.toLowerCase();

  if(
    t.includes("mehr rot")
  ){

    document.documentElement
      .style.setProperty(
        "--red",
        "#ff1028"
      );

  }

  if(
    t.includes("dunkler")
  ){

    document.documentElement
      .style.setProperty(
        "--bg",
        "#000000"
      );

  }

  action(
    "JOVS-Oberfläche geändert.",
    "ok"
  );

}


/* ==========================================================
   VOICE INPUT
========================================================== */

function setupSpeech(){

  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Speech){

    return;

  }


  recognition =
    new Speech();


  recognition.lang =
    "de-DE";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart=()=>{

    listening=true;

    document
      .getElementById("mic")
      .classList.add("active");

    setStatus("ZUHÖREN");

  };


  recognition.onend=()=>{

    listening=false;

    document
      .getElementById("mic")
      .classList.remove("active");

    setStatus("BEREIT");

  };


  recognition.onerror=()=>{

    listening=false;

    document
      .getElementById("mic")
      .classList.remove("active");

    setStatus("BEREIT");

  };


  recognition.onresult=
    event=>{

      const text =
        event.results[0][0]
          .transcript;

      document
        .getElementById("input")
        .value=text;

      sendMessage();

    };

}


function toggleMic(){

  if(!recognition){

    alert(
      "Dein Browser unterstützt keine Spracherkennung."
    );

    return;

  }


  if(listening){

    recognition.stop();

  }else{

    recognition.start();

  }

}


/* ==========================================================
   SPEECH OUTPUT
========================================================== */

function speak(text){

  if(
    !window.speechSynthesis
  ){

    return;

  }

  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";

  utterance.rate =
    .95;

  utterance.pitch =
    .72;

  utterance.volume =
    1;


  const voices =
    speechSynthesis.getVoices();


  const german =
    voices.find(
      v=>
        v.lang &&
        v.lang.toLowerCase()
          .startsWith("de")
    );


  if(german){

    utterance.voice=
      german;

  }


  speechSynthesis.speak(
    utterance
  );

}

      encodeURIComponent(query)

    .getElementById("settings")

function saveSettings(){

  apiKey =
    document
      .getElementById("apiKey")
      .value.trim();

  imageSize =
    document
      .getElementById("imageSize")
      .value;

  aspectRatio =
    document
      .getElementById("aspect")
      .value;


  if(apiKey){

    localStorage.setItem(
      KEY_NAME,
      apiKey
    );

  }else{

    localStorage.removeItem(
      KEY_NAME
    );

  }


  localStorage.setItem(
    "jovs_image_size",
    imageSize
  );

  localStorage.setItem(
    "jovs_aspect",
    aspectRatio
  );


  closeSettings();

  message(
    "JOVS wurde aktualisiert."
  );

}


/* ==========================================================
   HELPERS
========================================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function cleanJSON(text){

  let value =
    String(text).trim();

  value =
    value.replace(
      /^```json/i,
      ""
    );

  value =
    value.replace(
      /^```/i,
      ""
    );

  value =
    value.replace(
      /```$/i,
      ""
    );

  return value.trim();

}


function cleanCode(text){

  let value =
    String(text).trim();

  value =
    value.replace(
      /^```html/i,
      ""
    );

  value =
    value.replace(
      /^```/i,
      ""
    );

  value =
    value.replace(
      /```$/i,
      ""
    );

  return value.trim();

}


function safeName(text){

  return text
    .toLowerCase()
    .replace(
      /[^a-z0-9äöüß_-]+/gi,
      "_"
    )
    .replace(
      /^_+|_+$/g,
      ""
    )
    .substring(0,50)
    || "3d_modell";

}


function showHome(){

  message(
    "JOVS ist bereit. Sag mir einfach, was ich bauen, ändern, generieren oder öffnen soll."
  );

}
