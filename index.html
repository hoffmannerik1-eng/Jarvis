<script type="module" id="firebaseAuthModule">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDZ3Ix0yaK6MdNfcY1oXN7aJS4kbMUumc",
  authDomain: "xtree-c5ce2.firebaseapp.com",
  projectId: "xtree-c5ce2",
  storageBucket: "xtree-c5ce2.firebasestorage.app",
  messagingSenderId: "25145125484",
  appId: "1:25145125484:web:830081d8e000baf0504649"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const loginButton = document.getElementById("googleLoginBtn");

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginButton.textContent = "Angemeldet: " + (user.displayName || user.email);
    loginButton.title = "Zum Abmelden klicken";
  } else {
    loginButton.textContent = "Google anmelden";
    loginButton.title = "Mit Google anmelden";
  }
});

loginButton.addEventListener("click", async () => {
  if (auth.currentUser) {
    // Abmelden wird über eine kurze Bestätigung abgesichert.
    if (!confirm("Möchtest du dich von Xtree abmelden?")) return;
    try {
      const { signOut } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
      await signOut(auth);
    } catch (error) {
      alert("Abmelden fehlgeschlagen: " + error.message);
    }
    return;
  }
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const result = await signInWithPopup(auth, provider);
    alert("Google-Anmeldung erfolgreich. Willkommen bei Xtree, " + (result.user.displayName || result.user.email) + "!");
  } catch (error) {
    alert("Google-Anmeldung fehlgeschlagen: " + error.message + "\n\nPrüfe in Firebase, ob Google als Anmeldemethode aktiviert ist und ob die GitHub-Pages-Domain als autorisierte Domain eingetragen ist.");
  }
});
</script>

function mapIntent(text){
 const t=text.toLowerCase();
 const weather=/(wetter|temperatur|wie warm|regnet|wind)/i.test(t);
 const nearby=/(in meiner nähe|um mich|umgebung|hier in der nähe|nahe mir|standort|meine position)/i.test(t);

 const wantsMap=/(google maps|google map|maps|karte|3d|3-d|dreidimensional|earth|street ?view|virtuell|erkunde|erkunden|spazier|lauf|geh mal|wetter|temperatur|wie warm|regnet|wind|zeig mir.*(ort|stadt|turm|gebäude|umgebung)|wo liegt|wo ist|standort)/i.test(t);
 if(!wantsMap)return null;
 let q=text.trim()
  .replace(/^(xtree[, ]*)?(bitte )?/i,"")

  .replace(/^(lauf|geh|spazier|flieg|fahr|bring mich|navigiere|erkunde|zeig mir|zeige mir|öffne|mach|schau|such|suche|wo ist|wo liegt|finde)( bitte)?( mal)?( mit der)?( google)?( maps?)?(?:[ -]?(?:3d|3-d|dreidimensionalen?))?(?:[- ]?funktion)?/i,"")
  .replace(/^-?funktion\s+/i,"")
  .replace(/^(um|rund um|über|durch|in|nach|zum|zur|ans|an den|an die)\s+/i,"")
  .replace(/^(den|die|das|dem|der|einen|einem|ein|eine)\s+/i,"")
  .replace(/\s+(in 3d|in google maps|auf google maps|mit google maps|in street ?view)$/i,"")
  .replace(/\s+(bitte|mal|3d|3-d|dreidimensional|funktion|ansicht)$/i,"")
  .trim();
 if(!q||/^(meinen standort|meine umgebung|hier|in meiner nähe|meine position)$/i.test(q))q="mein aktueller Standort";
 return {query:q,threeD,weather,nearby,walking:/(lauf|geh|spazier|zu fuß|zu fuss)/i.test(t)};
}

async function geocodeXtreePlace(query){

 const r=await fetch(url);if(!r.ok)throw new Error("Ortssuche fehlgeschlagen (HTTP "+r.status+")");
 const j=await r.json(),feature=j.features&&j.features[0];if(!feature)throw new Error("Ich konnte diesen Ort nicht finden.");
 const c=feature.geometry.coordinates,p=feature.properties||{};
 return {lng:Number(c[0]),lat:Number(c[1]),name:[p.name,p.city,p.country].filter(Boolean).join(", ")||query};
}
function initXtreeMap(el,query,threeD,messageAt,status,orbit,tilt,reset){

    let tries=0;while(!window.maplibregl&&tries++<30)await new Promise(r=>setTimeout(r,200));

   map.addControl({onAdd:function(m){
    const wrap=document.createElement("div");wrap.className="maplibregl-ctrl maplibregl-ctrl-group";
    const btn=document.createElement("button");btn.type="button";btn.title="Satellitenbild ein-/ausschalten";btn.setAttribute("aria-label","Satellitenbild ein-/ausschalten");btn.textContent="🛰";btn.style.cssText="width:42px;font-size:18px";
    btn.onclick=()=>{const layer=m.getLayer("xtree-satellite-layer");if(!layer)return;const visible=m.getLayoutProperty("xtree-satellite-layer","visibility")!=="none";m.setLayoutProperty("xtree-satellite-layer","visibility",visible?"none":"visible");btn.title=visible?"Satellitenbild einschalten":"Kartenansicht einschalten";status.textContent=visible?"Normale Kartenansicht":"Satellitenaufnahme aktiviert";};
    wrap.appendChild(btn);return wrap;

   map.on("load",()=>{

     map.addSource("xtree-satellite-source",{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Imagery © Esri, Maxar, Earthstar Geographics and contributors"});

     const buildingSource=Object.entries(style.sources||{}).find(([name,source])=>name==="openmaptiles"||((source.url||"").includes("openmaptiles")));
     if(buildingSource&&!map.getLayer("xtree-3d-buildings")){
      map.addLayer({id:"xtree-3d-buildings",source:buildingSource[0],"source-layer":"building",type:"fill-extrusion",minzoom:13,paint:{"fill-extrusion-color":["interpolate",["linear"],["coalesce",["to-number",["get","render_height"]],["to-number",["get","height"]],8],0,"#526f8d",60,"#a8c6e4"],"fill-extrusion-height":["max",2,["coalesce",["to-number",["get","render_height"]],["to-number",["get","height"]],8]],"fill-extrusion-base":["coalesce",["to-number",["get","render_min_height"]],["to-number",["get","min_height"]],0],"fill-extrusion-opacity":.94}},before&&before.id);
     }
    }catch(e){console.warn("Xtree 3D-Gebäude:",e)}
    const marker=document.createElement("div");marker.style.cssText="width:14px;height:14px;border-radius:50%;background:#35b8ff;border:3px solid white;box-shadow:0 0 18px #168cff";

    if(threeD){map.easeTo({pitch:68,zoom:17.5,bearing:map.getBearing()+360,duration:16000});}
   });
   map.on("error",e=>{if(e&&e.error)console.warn("Xtree MapLibre:",e.error)});
   orbit.onclick=()=>{const b=map.getBearing();map.easeTo({bearing:b+360,pitch:Math.max(60,map.getPitch()),duration:18000});status.textContent="Xtree führt einen Kameraflug um "+place.name+" aus …"};

  }catch(e){status.textContent="Karte konnte nicht geladen werden: "+e.message}
 };

async function runMapIntent(intent){

   const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:120000}));
   const lat=pos.coords.latitude,lon=pos.coords.longitude;
   if(intent.weather){
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&timezone=auto");

   }
   if(intent.nearby||q==="mein aktueller Standort"){
    const msg="Ich habe deinen Standort gefunden. Die interaktive "+(intent.threeD?"3D-Karte":"Karte")+" wird direkt hier im Chat angezeigt. Deine Koordinaten bleiben nur für diese Kartenansicht im Arbeitsspeicher und werden nicht im Chat gespeichert.";
    add("assistant",msg);
    const last=state.current[state.current.length-1];last.map={query:"mein aktueller Standort",threeD:intent.threeD};xtreeLiveMapCenters[last.at]={lat, lng:lon};save();render();
   }
  }catch(e){add("assistant",e.code===1?"Standortzugriff wurde abgelehnt. Erlaube Xtree den Standortzugriff im Browser, wenn du diese Funktion nutzen möchtest.":"Standort/Wetter konnte nicht geladen werden: "+e.message)}
  finally{$("busy").classList.remove("show");$("busy").textContent="Xtree denkt nach …"}
  return true;
 }
 if(q!=="mein aktueller Standort"){
  add("assistant","Ich zeige "+q+" direkt hier im Chat"+(intent.threeD?" in einer interaktiven 3D-Karte. Xtree startet den Kameraflug automatisch.":" auf einer interaktiven Karte.")+" Du kannst die Ansicht drehen, neigen und zoomen.",[]);
  const last=state.current[state.current.length-1];last.map={query:q,threeD:intent.threeD};save();render();
 }
 return true;
}

async function ollamaCall(k,text){const model=k.model||"llama3.2";const r=await fetch("http://localhost:11434/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,messages:[{role:"system",content:state.system},{role:"user",content:text}],stream:false})});const j=await r.json();if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j.message?.content||"Keine Antwort erhalten."}
let mediaRecorder=null,recordedChunks=[];async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();$("recordBtn").textContent="●";return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Sprachmemo-Aufnahme wird in diesem Browser nicht unterstützt.");return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});const ext=(blob.type.includes("mp4")?"m4a":"webm");pendingFiles.push(new File([blob],"Xtree-Sprachmemo."+ext,{type:blob.type}));stream.getTracks().forEach(t=>t.stop());$("recordBtn").textContent="●";toast("Sprachmemo angehängt. Sende sie mit deiner Nachricht.")};mediaRecorder.start();$("recordBtn").textContent="■";toast("Sprachmemo läuft. Tippe erneut zum Beenden.")}catch(e){toast("Mikrofonzugriff nicht möglich: "+e.message)}}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Spracheingabe wird in diesem Browser nicht unterstützt.");return}if(recognition){recognition.stop();recognition=null;return}recognition=new SR();recognition.lang="de-DE";recognition.interimResults=false;recognition.onresult=e=>{$("prompt").value+=($("prompt").value?" ":"")+e.results[0][0].transcript};recognition.onerror=()=>toast("Spracheingabe konnte nicht gestartet werden.");recognition.onend=()=>{recognition=null};recognition.start();toast("Ich höre zu …")}
$("sendBtn").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{const t=$("prompt");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,150)+"px"});$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{pendingFiles=pendingFiles.concat(Array.from(e.target.files));toast(pendingFiles.length+" Datei(en) angehängt.");e.target.value=""};$("voiceBtn").onclick=startVoice;$("recordBtn").onclick=toggleRecording;$("settingsBtn").addEventListener("click",e=>{e.preventDefault();try{openSettings("providers")}catch(err){console.error("Xtree Einstellungen:",err);toast("Einstellungen konnten nicht geladen werden: "+(err&&err.message?err.message:"Unbekannter Fehler"))}});$("historyBtn").onclick=openHistory;$("toolsBtn").onclick=openTools;$("closePanel").onclick=closePanel;$("panel").addEventListener("click",e=>{if(e.target===$("panel"))closePanel()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
