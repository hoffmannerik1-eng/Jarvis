<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOVS AI</title>

<style>
:root{
  --bg:#05070a;
  --panel:#0a0f14;
  --panel2:#0d141b;
  --line:rgba(255,255,255,.08);
  --text:#edf5f1;
  --muted:#82918c;
  --green:#45ff9a;
  --green2:#1bd979;
  --blue:#52a7ff;
  --red:#ff526c;
  --yellow:#ffd45a;
  --shadow:0 20px 70px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:grid;
  grid-template-columns:270px 1fr 390px;
  grid-template-rows:64px 1fr;
  background:
    radial-gradient(circle at 50% 0%,rgba(69,255,154,.06),transparent 35%),
    radial-gradient(circle at 100% 100%,rgba(82,167,255,.04),transparent 30%);
}

/* HEADER */

.header{
  grid-column:1/4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(5,7,10,.82);
  backdrop-filter:blur(20px);
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  letter-spacing:3px;
}

.logoOrb{
  width:34px;
  height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff,transparent 8%),
    radial-gradient(circle,#45ff9a 0%,#0d7b4b 40%,#06130e 72%);
  box-shadow:
    0 0 15px rgba(69,255,154,.65),
    0 0 45px rgba(69,255,154,.18);
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.headerCenter{
  display:flex;
  gap:8px;
  align-items:center;
}

.status{
  padding:8px 12px;
  border:1px solid rgba(69,255,154,.18);
  border-radius:999px;
  color:var(--green);
  font-size:12px;
  background:rgba(69,255,154,.05);
}

.headerButtons{
  display:flex;
  gap:7px;
}

.hbtn{
  border:1px solid var(--line);
  background:#0b1117;
  color:#dce7e2;
  border-radius:9px;
  padding:8px 11px;
  transition:.2s;
}

.hbtn:hover{
  border-color:rgba(69,255,154,.4);
  color:var(--green);
  transform:translateY(-1px);
}

/* SIDEBAR */

.sidebar{
  border-right:1px solid var(--line);
  background:rgba(7,11,15,.9);
  overflow:auto;
  padding:16px;
}

.sectionTitle{
  font-size:10px;
  color:#5f6d68;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:12px 5px 9px;
}

.project{
  padding:11px;
  border:1px solid transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:5px;
  color:#b9c6c1;
  transition:.2s;
}

.project:hover{
  background:#0d141a;
}

.project.active{
  background:rgba(69,255,154,.07);
  border-color:rgba(69,255,154,.18);
  color:var(--green);
}

.projectIcon{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:#111920;
}

.file{
  padding:8px 9px 8px 35px;
  color:#82918c;
  font-size:13px;
  cursor:pointer;
  border-radius:7px;
}

.file:hover{
  background:#0d141a;
  color:white;
}

.file.active{
  color:var(--green);
  background:rgba(69,255,154,.05);
}

.newProject{
  width:100%;
  border:1px dashed rgba(69,255,154,.25);
  background:transparent;
  color:var(--green);
  border-radius:9px;
  padding:10px;
  margin-top:8px;
}

/* WORKSPACE */

.workspace{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#070b0f;
}

.workspaceTop{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
}

.path{
  font-size:12px;
  color:#77847f;
}

.workspaceActions{
  display:flex;
  gap:7px;
}

.smallBtn{
  border:1px solid var(--line);
  background:#0c1319;
  color:#aab7b2;
  padding:7px 10px;
  border-radius:7px;
}

.smallBtn:hover{
  color:var(--green);
  border-color:rgba(69,255,154,.35);
}

.editorWrap{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.editor{
  min-width:0;
  position:relative;
  border-right:1px solid var(--line);
}

.editorLabel{
  height:36px;
  padding:10px 13px;
  font-size:11px;
  color:#6e7c77;
  border-bottom:1px solid var(--line);
}

textarea{
  width:100%;
  height:calc(100% - 36px);
  resize:none;
  border:0;
  outline:0;
  background:#060a0e;
  color:#dce9e3;
  padding:16px;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:13px;
  line-height:1.65;
}

.preview{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:white;
}

.previewHeader{
  height:36px;
  flex-shrink:0;
  background:#0b1015;
  color:#718079;
  border-bottom:1px solid var(--line);
  padding:10px 13px;
  font-size:11px;
}

#previewFrame{
  flex:1;
  width:100%;
  border:0;
  background:white;
}

/* CHAT */

.chat{
  border-left:1px solid var(--line);
  background:#080d12;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chatTop{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
}

.agentBadge{
  color:var(--green);
  font-size:11px;
  border:1px solid rgba(69,255,154,.2);
  background:rgba(69,255,154,.05);
  border-radius:999px;
  padding:5px 8px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:15px;
}

.msg{
  margin-bottom:13px;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.msg.user{
  display:flex;
  justify-content:flex-end;
}

.bubble{
  max-width:90%;
  padding:11px 13px;
  border-radius:13px;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
}

.msg.ai .bubble{
  background:#0d151b;
  border:1px solid var(--line);
}

.msg.user .bubble{
  background:rgba(69,255,154,.12);
  border:1px solid rgba(69,255,154,.16);
  color:#eafff3;
}

.action{
  margin-top:7px;
  padding:8px 10px;
  border-left:2px solid var(--green);
  background:#091017;
  color:#82918c;
  font-family:monospace;
  font-size:11px;
}

.chatInput{
  padding:12px;
  border-top:1px solid var(--line);
}

.inputRow{
  display:flex;
  gap:7px;
}

.chatInput input{
  flex:1;
  min-width:0;
  background:#0c1319;
  border:1px solid var(--line);
  color:white;
  outline:none;
  border-radius:10px;
  padding:11px 12px;
}

.chatInput input:focus{
  border-color:rgba(69,255,154,.4);
  box-shadow:0 0 0 3px rgba(69,255,154,.04);
}

.send{
  width:43px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#03120a;
  font-weight:900;
}

.mic{
  width:43px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0c1319;
  color:#b9c6c1;
}

.mic.active{
  color:#fff;
  background:#531c25;
  border-color:#a83748;
}

.quick{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-top:8px;
}

.quick button{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#0c1319;
  color:#75837e;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
}

/* API */

.apiPanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
  display:none;
  place-items:center;
  z-index:100;
}

.apiCard{
  width:min(500px,92vw);
  background:#0b1117;
  border:1px solid rgba(69,255,154,.2);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
}

.apiCard h2{
  margin:0 0 7px;
}

.apiCard p{
  color:#77847f;
  font-size:13px;
}

.apiCard input{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#060a0e;
  color:white;
  outline:0;
}

.apiButtons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.apiButtons button{
  flex:1;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#111820;
  color:white;
}

.apiButtons .save{
  background:var(--green);
  color:#03120a;
  border:0;
}

/* MOBILE */

@media(max-width:1100px){
  .app{
    grid-template-columns:220px 1fr;
  }

  .chat{
    display:none;
  }

  .header{
    grid-column:1/3;
  }
}

@media(max-width:750px){
  .app{
    grid-template-columns:1fr;
    grid-template-rows:60px 1fr;
  }

  .sidebar{
    display:none;
  }

  .header{
    grid-column:1;
  }

  .editorWrap{
    grid-template-columns:1fr;
  }

  .preview{
    display:none;
  }

  .headerCenter{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    <div class="logoOrb"></div>
    JOVS
  </div>

  <div class="headerCenter">
    <div class="status" id="status">● BEREIT</div>
  </div>

  <div class="headerButtons">
    <button class="hbtn" onclick="openGoogle()">Google</button>
    <button class="hbtn" onclick="openYouTube()">YouTube</button>
    <button class="hbtn" onclick="openMaps()">Maps</button>
    <button class="hbtn" onclick="openApi()">API</button>
  </div>

</header>


<aside class="sidebar">

  <div class="sectionTitle">Projekte</div>

  <div id="projects"></div>

  <button class="newProject" onclick="createProject()">
    + Neues Projekt
  </button>

  <div class="sectionTitle">Dateien</div>

  <div id="files"></div>

</aside>


<main class="workspace">

  <div class="workspaceTop">

    <div class="path" id="path">
      JOVS / index.html
    </div>

    <div class="workspaceActions">
      <button class="smallBtn" onclick="runPreview()">▶ Preview</button>
      <button class="smallBtn" onclick="saveProject()">Speichern</button>
      <button class="smallBtn" onclick="downloadCurrent()">Export</button>
    </div>

  </div>

  <div class="editorWrap">

    <div class="editor">

      <div class="editorLabel">
        CODE EDITOR
      </div>

      <textarea id="editor" spellcheck="false"></textarea>

    </div>

    <div class="preview">

      <div class="previewHeader">
        LIVE PREVIEW
      </div>

      <iframe id="previewFrame"></iframe>

    </div>

  </div>

</main>


<section class="chat">

  <div class="chatTop">
    <strong>JOVS Agent</strong>
    <span class="agentBadge">AUTONOM</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="chatInput">

    <div class="inputRow">

      <button class="mic" id="micBtn" onclick="toggleMic()">🎙</button>

      <input
        id="chatInput"
        autocomplete="off"
        placeholder="Sag JOVS, was er tun soll..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button class="send" onclick="sendMessage()">➤</button>

    </div>

    <div class="quick">
      <button onclick="quick('Erstelle ein neues 3D-Modell')">3D Modell</button>
      <button onclick="quick('Baue ein cooles Browser-Spiel')">Spiel bauen</button>
      <button onclick="quick('Verbessere das Design')">Design</button>
      <button onclick="quick('Öffne Google')">Google</button>
    </div>

  </div>

</section>

</div>


<!-- API PANEL -->

<div class="apiPanel" id="apiPanel">

  <div class="apiCard">

    <h2>Gemini API</h2>

    <p>
      Der Schlüssel wird nur lokal in diesem Browser gespeichert.
      Für eine echte öffentliche Website solltest du später einen Backend-Proxy verwenden.
    </p>

    <input
      id="apiKey"
      type="password"
      placeholder="Gemini API Key"
    >

    <div class="apiButtons">
      <button onclick="closeApi()">Abbrechen</button>
      <button class="save" onclick="saveApi()">Speichern</button>
    </div>

  </div>

</div>


<script>

/* =========================================================
   JOVS CORE
========================================================= */

const MODEL = "gemini-3.8-flash";

const API_STORAGE = "jovs_gemini_key";

let apiKey = localStorage.getItem(API_STORAGE) || "";

let currentProject = "JOVS";
let currentFile = "index.html";

let micListening = false;
let recognition = null;

let agentHistory = [];

let projects = JSON.parse(
  localStorage.getItem("jovs_projects") || "null"
);


/* =========================================================
   DEFAULT PROJECTS
========================================================= */

if(!projects){

  projects = {

    JOVS:{
      name:"JOVS",
      files:{
        "index.html":`<!DOCTYPE html>
<html>
<head>
<title>JOVS Project</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#05070a;
  color:#45ff9a;
  font-family:Arial;
}
h1{
  font-size:60px;
}
</style>
</head>
<body>
<h1>JOVS</h1>
</body>
</html>`
      }
    },

    GameZone:{
      name:"GameZone",
      files:{
        "index.html":`<!DOCTYPE html>
<html>
<body style="background:#090909;color:white;font-family:Arial;text-align:center">
<h1>GameZone</h1>
<p>Dein neues Spielprojekt.</p>
</body>
</html>`
      }
    },

    Axolotl:{
      name:"Axolotl",
      files:{
        "index.html":`<!DOCTYPE html>
<html>
<body style="background:#07141a;color:#fff;font-family:Arial;text-align:center">
<h1>Axolotl World</h1>
</body>
</html>`
      }
    }

  };

  persist();

}


/* =========================================================
   STORAGE
========================================================= */

function persist(){

  localStorage.setItem(
    "jovs_projects",
    JSON.stringify(projects)
  );

}


/* =========================================================
   UI
========================================================= */

function renderProjects(){

  const box = document.getElementById("projects");

  box.innerHTML = "";

  Object.keys(projects).forEach(name=>{

    const p = document.createElement("div");

    p.className =
      "project " +
      (name===currentProject ? "active":"");

    p.innerHTML = `
      <div class="projectIcon">▣</div>
      <span>${escapeHtml(name)}</span>
    `;

    p.onclick = ()=>{

      currentProject = name;

      const files =
        Object.keys(projects[name].files);

      currentFile =
        files.includes("index.html")
        ? "index.html"
        : files[0];

      renderAll();

    };

    box.appendChild(p);

  });

}


function renderFiles(){

  const box = document.getElementById("files");

  box.innerHTML = "";

  const files =
    projects[currentProject].files;

  Object.keys(files).forEach(path=>{

    const f = document.createElement("div");

    f.className =
      "file " +
      (path===currentFile ? "active":"");

    f.textContent = "📄 " + path;

    f.onclick = ()=>{

      currentFile = path;

      loadCurrentFile();

      renderFiles();

    };

    box.appendChild(f);

  });

}


function renderAll(){

  renderProjects();
  renderFiles();
  loadCurrentFile();

}


function loadCurrentFile(){

  const content =
    projects[currentProject].files[currentFile] || "";

  document.getElementById("editor").value =
    content;

  document.getElementById("path").textContent =
    currentProject + " / " + currentFile;

  runPreview();

}


/* =========================================================
   EDITOR
========================================================= */

document
.getElementById("editor")
.addEventListener("input",()=>{

  projects[currentProject].files[currentFile] =
    document.getElementById("editor").value;

  persist();

});


function saveProject(){

  projects[currentProject].files[currentFile] =
    document.getElementById("editor").value;

  persist();

  actionLog(
    "Projekt gespeichert",
    "success"
  );

}


/* =========================================================
   PREVIEW
========================================================= */

function runPreview(){

  const code =
    document.getElementById("editor").value;

  if(!code) return;

  document
    .getElementById("previewFrame")
    .srcdoc = code;

}


function downloadCurrent(){

  const code =
    projects[currentProject].files[currentFile];

  const blob =
    new Blob([code],{type:"text/html"});

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    currentFile.split("/").pop();

  a.click();

  setTimeout(()=>{
    URL.revokeObjectURL(a.href);
  },1000);

}


/* =========================================================
   PROJECT CREATION
========================================================= */

function createProject(){

  const name =
    prompt("Name des neuen Projekts:");

  if(!name) return;

  if(projects[name]){
    alert("Dieses Projekt existiert bereits.");
    return;
  }

  projects[name]={
    name,
    files:{
      "index.html":`<!DOCTYPE html>
<html>
<head>
<title>${escapeHtml(name)}</title>
</head>
<body>
<h1>${escapeHtml(name)}</h1>
</body>
</html>`
    }
  };

  currentProject=name;
  currentFile="index.html";

  persist();
  renderAll();

}


/* =========================================================
   CHAT
========================================================= */

function addMessage(text,type="ai"){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "msg " + type;

  const bubble =
    document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  wrapper.appendChild(bubble);

  document
    .getElementById("messages")
    .appendChild(wrapper);

  const messages =
    document.getElementById("messages");

  messages.scrollTop =
    messages.scrollHeight;

  return wrapper;

}


function actionLog(text,status=""){

  const wrapper =
    document.createElement("div");

  wrapper.className="msg ai";

  const action =
    document.createElement("div");

  action.className="action";

  action.textContent =
    "› " + text;

  if(status==="error"){
    action.style.borderColor="var(--red)";
  }

  wrapper.appendChild(action);

  document
    .getElementById("messages")
    .appendChild(wrapper);

  const messages =
    document.getElementById("messages");

  messages.scrollTop =
    messages.scrollHeight;

}


function quick(text){

  document.getElementById("chatInput").value=text;

  sendMessage();

}


/* =========================================================
   GEMINI AGENT SCHEMA
========================================================= */

const agentSchema = {

  type:"object",

  properties:{

    reply:{
      type:"string",
      description:"Kurze Antwort an den Benutzer."
    },

    actions:{
      type:"array",
      description:"Aktionen, die JOVS im Browser ausführen soll.",
      items:{
        type:"object",

        properties:{

          type:{
            type:"string",
            enum:[
              "edit_file",
              "create_file",
              "delete_file",
              "create_3d",
              "build_project",
              "preview",
              "open_google",
              "open_youtube",
              "open_maps",
              "open_website",
              "save_project",
              "change_ui"
            ]
          },

          path:{
            type:["string","null"]
          },

          content:{
            type:["string","null"]
          },

          query:{
            type:["string","null"]
          },

          url:{
            type:["string","null"]
          },

          name:{
            type:["string","null"]
          },

          instruction:{
            type:["string","null"]
          },

          files:{
            type:["array","null"],
            items:{
              type:"object",
              properties:{
                path:{type:"string"},
                content:{type:"string"}
              },
              required:["path","content"]
            }
          }

        },

        required:["type"]
      }
    }

  },

  required:["reply","actions"]

};


/* =========================================================
   SYSTEM PROMPT
========================================================= */

function buildSystemPrompt(){

  const fileList =
    Object.keys(
      projects[currentProject].files
    );

  const currentContent =
    projects[currentProject]
      .files[currentFile] || "";

  return `

DU BIST JOVS.

Du bist ein autonomer Browser-, Coding-, Design- und
Projekt-Agent.

SPRACHE:
Antworte auf Deutsch.

DEINE AUFGABE:
Verstehe natürliche Sprache und führe die gewünschten
Aktionen über die bereitgestellten Aktionen aus.

- das eigene JOVS-Projekt verändern
- UI-Strukturen verändern
- Browser-Projekte erstellen
- Spiele erstellen
- Apps als Webapps erstellen
- 3D-Szenen erstellen
- 3D-Modelle mit Three.js erstellen
- beliebig viele neue 3D-Projekte/Szenen erzeugen
- Webseiten öffnen
- Google öffnen
- YouTube öffnen
- Google Maps öffnen
- Projekte speichern
- Live Preview aktualisieren

WICHTIG:

Wenn der Benutzer sagt:

"ändere dich"

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if(!text) return;

  input.value="";

  addMessage(text,"user");

  if(!apiKey){

    addMessage(
      "Bitte zuerst deinen Gemini API-Key über „API“ eintragen.",
      "ai"
    );

    openApi();

    return;
  }

  setStatus("DENKEN");

  actionLog("JOVS analysiert die Aufgabe...");

  try{

    const result =
      await askGeminiAgent(text);

    if(result.reply){

      addMessage(
        result.reply,
        "ai"
      );

    }

    if(Array.isArray(result.actions)){

      for(const action of result.actions){

        await executeAction(action);

      }

    }

    agentHistory.push({
      role:"user",
      text
    });

    agentHistory.push({
      role:"assistant",
      text:result.reply || ""
    });

    if(agentHistory.length>12){

      agentHistory =
        agentHistory.slice(-12);

    }

    setStatus("BEREIT");

  }catch(error){

    console.error(error);

    actionLog(
      "Fehler: " + error.message,
      "error"
    );

    addMessage(
      "Ich konnte die Aufgabe nicht ausführen: " +
      error.message,
      "ai"
    );

    setStatus("FEHLER");

  }

}


/* =========================================================
   GEMINI REQUEST
========================================================= */

async function askGeminiAgent(userText){

  const historyText =
    agentHistory
      .map(x=>`${x.role}: ${x.text}`)
      .join("\n");

  const prompt =

    buildSystemPrompt() +

    `

BISHERIGE UNTERHALTUNG:
${historyText}

NEUE BENUTZERANWEISUNG:
${userText}

Plane die notwendigen Aktionen.

Wenn mehrere Aktionen nötig sind,
gib alle Aktionen in der richtigen Reihenfolge zurück.

Wenn eine Datei erstellt oder geändert wird,
liefere den vollständigen Inhalt.

Wenn ein Projekt gebaut werden soll,
liefere alle benötigten Dateien.

Gib ausschließlich gültiges JSON gemäß Schema zurück.
`;


  const endpoint =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    encodeURIComponent(MODEL) +
    ":generateContent";


  const response =
    await fetch(endpoint,{

      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "x-goog-api-key":apiKey
      },

      body:JSON.stringify({

        contents:[

          {
            role:"user",
            parts:[
              {
                text:prompt
              }
            ]
          }

        ],

        generationConfig:{

          temperature:.2,

          responseMimeType:
            "application/json",

          responseSchema:
            agentSchema

        }

      })

    });


  const data =
    await response.json();


  if(!response.ok){

    const message =
      data?.error?.message ||
      "Gemini API Fehler";

    throw new Error(message);

  }


  const raw =
    data?.candidates?.[0]
      ?.content?.parts?.[0]?.text;


  if(!raw){

    throw new Error(
      "Gemini hat keine Antwort geliefert."
    );

  }


  try{

    return JSON.parse(raw);

  }catch{

    throw new Error(
      "Gemini-Antwort war kein gültiges JSON."
    );

  }

}


/* =========================================================
   ACTION EXECUTOR
========================================================= */

async function executeAction(action){

  if(!action || !action.type) return;

  actionLog(
    "Aktion: " + action.type
  );


  switch(action.type){

    case "edit_file":

      await editFile(action);

      break;


    case "create_file":

      await createFile(action);

      break;


    case "delete_file":

      await deleteFile(action);

      break;


    case "create_3d":

      await create3D(action);

      break;


    case "build_project":

      await buildProject(action);

      break;


    case "preview":

      runPreview();

      break;


    case "open_google":

      openGoogle(action.query || "");

      break;


    case "open_youtube":

      openYouTube(action.query || "");

      break;


    case "open_maps":

      openMaps(action.query || "");

      break;


    case "open_website":

      openWebsite(action.url);

      break;


    case "save_project":

      saveProject();

      break;


    case "change_ui":

      changeUI(action);

      break;

  }

}


/* =========================================================
   EDIT FILE
========================================================= */

async function editFile(action){

  if(!action.path){
    throw new Error("edit_file benötigt path.");
  }

  if(typeof action.content!=="string"){
    throw new Error(
      "edit_file benötigt content."
    );
  }

  projects[currentProject]
    .files[action.path] =
      action.content;

  currentFile =
    action.path;

  persist();
  renderAll();

  actionLog(
    "Datei geändert: " + action.path,
    "success"
  );

}


/* =========================================================
   CREATE FILE
========================================================= */

async function createFile(action){

  if(!action.path){
    throw new Error(
      "create_file benötigt path."
    );
  }

  projects[currentProject]
    .files[action.path] =
      action.content || "";

  currentFile =
    action.path;

  persist();
  renderAll();

  actionLog(
    "Datei erstellt: " + action.path,
    "success"
  );

}


/* =========================================================
   DELETE FILE
========================================================= */

async function deleteFile(action){

  if(!action.path) return;

  if(
    !projects[currentProject]
      .files[action.path]
  ){
    return;
  }

  delete projects[currentProject]
    .files[action.path];

  const files =
    Object.keys(
      projects[currentProject].files
    );

  currentFile =
    files[0] || "";

  persist();
  renderAll();

  actionLog(
    "Datei gelöscht: " + action.path,
    "success"
  );

}


/* =========================================================
   BUILD PROJECT
========================================================= */

async function buildProject(action){

  if(!Array.isArray(action.files)){

    throw new Error(
      "build_project benötigt files."
    );

  }


  for(const file of action.files){

    if(
      !file.path ||
      typeof file.content!=="string"
    ){
      continue;
    }

    projects[currentProject]
      .files[file.path] =
        file.content;

    actionLog(
      "Baue Datei: " + file.path
    );

  }


  if(action.files.length){

    currentFile =
      action.files[0].path;

  }


  persist();
  renderAll();

  actionLog(
    "Projekt vollständig gebaut.",
    "success"
  );

}

/* =========================================================
   UI CHANGES
========================================================= */

function changeUI(action){

  const instruction =
    (action.instruction || "")
      .toLowerCase();


  if(
    instruction.includes("grün") ||
    instruction.includes("green")
  ){

    document.documentElement
      .style.setProperty(
        "--green",
        "#45ff9a"
      );

  }


  if(
    instruction.includes("blau") ||
    instruction.includes("blue")
  ){

    document.documentElement
      .style.setProperty(
        "--green",
        "#52a7ff"
      );

  }


  if(
    instruction.includes("rot") ||
    instruction.includes("red")
  ){

    document.documentElement
      .style.setProperty(
        "--green",
        "#ff526c"
      );

  }


  actionLog(
    "JOVS-Oberfläche geändert.",
    "success"
  );

}


/* =========================================================
   EXTERNAL WEB
========================================================= */

function openGoogle(query=""){

  const q =
    query
      ? "?q="+encodeURIComponent(query)
      : "";

  window.location.href =
    "https://www.google.com/" + q;

}


function openYouTube(query=""){

  const q =
    query
      ? "?search_query="+
        encodeURIComponent(query)
      : "";

  window.location.href =
    "https://www.youtube.com/" + q;

}


function openMaps(query=""){

  const q =
    query
      ? "/search/"+encodeURIComponent(query)
      : "";

  window.location.href =
    "https://www.google.com/maps" + q;

}


function openWebsite(url){

  if(!url) return;

  if(
    !/^https?:\/\//i.test(url)
  ){
    url="https://"+url;
  }

  window.location.href=url;

}


/* =========================================================
   API PANEL
========================================================= */

function openApi(){

  document
    .getElementById("apiPanel")
    .style.display="grid";

  document
    .getElementById("apiKey")
    .value=apiKey;

}


function closeApi(){

  document
    .getElementById("apiPanel")
    .style.display="none";

}


function saveApi(){

  apiKey =
    document
      .getElementById("apiKey")
      .value.trim();

  if(apiKey){

    localStorage.setItem(
      API_STORAGE,
      apiKey
    );

  }else{

    localStorage.removeItem(
      API_STORAGE
    );

  }

  closeApi();

  addMessage(
    "Gemini API wurde lokal gespeichert.",
    "ai"
  );

}


/* =========================================================
   VOICE
========================================================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    document
      .getElementById("micBtn")
      .style.display="none";

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.lang="de-DE";

  recognition.continuous=false;

  recognition.interimResults=false;


  recognition.onstart=()=>{

    micListening=true;

    document
      .getElementById("micBtn")
      .classList.add("active");

    setStatus("ZUHÖREN");

  };


  recognition.onend=()=>{

    micListening=false;

    document
      .getElementById("micBtn")
      .classList.remove("active");

    setStatus("BEREIT");

  };


  recognition.onerror=()=>{

    micListening=false;

    document
      .getElementById("micBtn")
      .classList.remove("active");

    setStatus("BEREIT");

  };


  recognition.onresult=(event)=>{

    const text =
      event.results[0][0].transcript;

    document
      .getElementById("chatInput")
      .value=text;

    sendMessage();

  };

}


function toggleMic(){

  if(!recognition){

    alert(
      "Spracherkennung wird von diesem Browser nicht unterstützt."
    );

    return;

  }

  if(micListening){

    recognition.stop();

  }else{

    recognition.start();

  }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  document
    .getElementById("status")
    .textContent =
      "● " + text;

}


/* =========================================================
   SECURITY / HELPERS
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
