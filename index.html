<script type="module" id="firebaseAuthModule">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDZ3Ix0yaK6MdNfcY1oXN7aJS4kbMUumc",
  authDomain: "xtree-c5ce2.firebaseapp.com",
  projectId: "xtree-c5ce2",
  storageBucket: "xtree-c5ce2.firebasestorage.app",
  messagingSenderId: "25145125484",
  appId: "1:25145125484:web:830081d8e000baf0504649"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const loginButton = document.getElementById("googleLoginBtn");

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginButton.textContent = "Angemeldet: " + (user.displayName || user.email);
    loginButton.title = "Zum Abmelden klicken";
  } else {
    loginButton.textContent = "Google anmelden";
    loginButton.title = "Mit Google anmelden";
  }
});

loginButton.addEventListener("click", async () => {
  if (auth.currentUser) {
    // Abmelden wird über eine kurze Bestätigung abgesichert.
    if (!confirm("Möchtest du dich von Xtree abmelden?")) return;
    try {
      const { signOut } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
      await signOut(auth);
    } catch (error) {
      alert("Abmelden fehlgeschlagen: " + error.message);
    }
    return;
  }
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const result = await signInWithPopup(auth, provider);
    alert("Google-Anmeldung erfolgreich. Willkommen bei Xtree, " + (result.user.displayName || result.user.email) + "!");
  } catch (error) {
    alert("Google-Anmeldung fehlgeschlagen: " + error.message + "\n\nPrüfe in Firebase, ob Google als Anmeldemethode aktiviert ist und ob die GitHub-Pages-Domain als autorisierte Domain eingetragen ist.");
  }
});
</script>

function filesToData(files){return Promise.all(Array.from(files).map(f=>new Promise(resolve=>{if(f.size>8*1024*1024){toast(f.name+" ist größer als 8 MB.");resolve(null);return}const reader=new FileReader();reader.onload=()=>resolve({name:f.name,type:f.type,data:f.type.startsWith("image/")?reader.result:null,text:f.type.startsWith("text/")?String(reader.result||"").slice(0,12000):null});reader.onerror=()=>resolve({name:f.name,type:f.type});if(f.type.startsWith("image/")||f.type.startsWith("text/")||f.type.startsWith("audio/"))reader.readAsDataURL(f);else resolve({name:f.name,type:f.type})})))}
async function send(){if(busy)return;const text=$("prompt").value.trim();if(!text&&!pendingFiles.length)return;$("prompt").value="";const files=pendingFiles;pendingFiles=[];const fdata=await filesToData(files);add("user",text,fdata.filter(Boolean));if(/^Google-Suche:/i.test(text)){window.open("https://www.google.com/search?q="+encodeURIComponent(text.replace(/^Google-Suche:/i,"").trim()),"_blank","noopener");return}if(/^Bildersuche:/i.test(text)){window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(text.replace(/^Bildersuche:/i,"").trim()),"_blank","noopener");return}if(text.toLowerCase().startsWith("erstelle ein bild von:")||text.toLowerCase().startsWith("erstelle ein bild")||text.toLowerCase().startsWith("generiere ein bild")||text.toLowerCase().startsWith("zeichne ein bild")||text.toLowerCase().startsWith("male ein bild")){const prompt=text.replace(/^Erstelle ein Bild von:/i,"").trim()||text;await generateImage(prompt);return}if(/^(chatfenster|öffne chatfenster)$/i.test(text)){openHistory();return}if(/^(chatfenster schließen|schließe chatfenster)$/i.test(text)){closePanel();add("assistant","Das Chatfenster ist geschlossen.");return}if(/^(einstellungen|öffne einstellungen)$/i.test(text)){openSettings();return}if(/^(tools|öffne tools)$/i.test(text)){openTools();return}await askAI(text,fdata.filter(Boolean))}
function filePayload(files){return (files||[]).filter(f=>f.data&&f.type&&f.type.startsWith("image/")).map(f=>({type:"image_url",image_url:{url:f.data}}))}
async function generateImage(prompt){const key=state.keys.find(k=>k.provider==="OpenRouter"&&k.key);if(!key){add("assistant","Für die Bildgenerierung brauchst du einen OpenRouter-API-Schlüssel. Öffne Einstellungen → KI-Anbieter und füge OpenRouter hinzu.");return}busy=true;$("busy").classList.add("show");$("busy").textContent="Xtree erstellt dein Bild …";$("sendBtn").disabled=true;try{const model=state.imageModel||"google/gemini-3.1-flash-image";const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+key.key,"Content-Type":"application/json","HTTP-Referer":location.origin,"X-Title":"Xtree"},body:JSON.stringify({model,modalities:["image","text"],messages:[{role:"user",content:"Create an image from this description: "+prompt}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||("HTTP "+r.status));const msg=j.choices?.[0]?.message||{};let imageUrl=null;const candidates=[];if(Array.isArray(msg.images))candidates.push(...msg.images);if(Array.isArray(msg.content))candidates.push(...msg.content);for(const p of candidates){const u=p?.image_url?.url||p?.url||p?.data;if(typeof u==="string"&&(u.startsWith("data:image/")||u.startsWith("https://")||u.startsWith("http://"))){imageUrl=u;break}if(typeof p?.image_url==="string"&&p.image_url.startsWith("data:image/")){imageUrl=p.image_url;break}}if(!imageUrl)throw new Error("Das Modell hat kein Bild zurückgegeben. Prüfe das Bildmodell in Einstellungen oder wähle ein anderes OpenRouter-Bildmodell.");const answer=typeof msg.content==="string"?msg.content:"Dein Bild ist fertig.";let mime="image/png";if(imageUrl.startsWith("data:")){const semi=imageUrl.indexOf(";");if(semi>5)mime=imageUrl.slice(5,semi)}add("assistant",answer,[{name:"Xtree-Bild",type:mime,data:imageUrl}]);}catch(e){add("assistant","Das Bild konnte nicht erstellt werden. "+e.message+"\n\nPrüfe deinen OpenRouter-Schlüssel, dein Guthaben und das Bildmodell in den Einstellungen.")}finally{busy=fa async function callProviders(text,files){const attempts=state.keys.filter(k=>k.provider==="Firebase AI Logic"||k.provider==="Ollama"||k.key);if(!attempts.length)throw new Error("Noch kein KI-Anbieter eingerichtet. Füge einen Anbieter samt API-Schlüssel hinzu oder aktiviere Firebase AI Logic.");const isCode=/\b(code|coding|programmier|javascript|typescript|python|html|css|react|firebase|github|api|debug|script|website|spiel|app)\b/i.test(text);let errors=[];for(const original of attempts){const k={...original,model:isCode?(original.codeModel||original.model):(original.chatModel||original.model)};try{if(k.provider==="OpenRouter")return await openRouter(k,text,files);if(k.provider==="Gemini")return await gemini(k,text,files);if(k.provider==="Firebase AI Logic")return await firebaseAILogic(k,text);if(k.provider==="Ollama")return await ollamaCall(k,text);if(["Groq","Cerebras","Mistral","Hugging Face"].includes(k.provider))return await compatibleProvider(k,text,files)}catch(e){errors.push(k.provider+": "+e.message)}}throw new Error(errors.join(" | ")||"Alle Anbieter sind fehlgeschlagen.")}
async function openRouter(k,text,files){const content=[{type:"text",text:text}].concat(filePayload(files));const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+k.key,"Content-Type":"application/json","HTTP-Referer":location.origin,"X-Title":"Xtree"},body:JSON.stringify({model:k.model||state.model,messages:[{role:"system",content:state.system},{role:"user",content:content}],temperature:.7})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||("HTTP "+r.status));return j.choices?.[0]?.message?.content||"Keine Antwort erhalten."}

let mediaRecorder=null,recordedChunks=[];async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();$("recordBtn").textContent="●";return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Sprachmemo-Aufnahme wird in diesem Browser nicht unterstützt.");return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});const ext=(blob.type.includes("mp4")?"m4a":"webm");pendingFiles.push(new File([blob],"Xtree-Sprachmemo."+ext,{type:blob.type}));stream.getTracks().forEach(t=>t.stop());$("recordBtn").textContent="●";toast("Sprachmemo angehängt. Sende sie mit deiner Nachricht.")};mediaRecorder.start();$("recordBtn").textContent="■";toast("Sprachmemo läuft. Tippe erneut zum Beenden.")}catch(e){toast("Mikrofonzugriff nicht möglich: "+e.message)}}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Spracheingabe wird in diesem Browser nicht unterstützt.");return}if(recognition){recognition.stop();recognition=null;return}recognition=new SR();recognition.lang="de-DE";recognition.interimResults=false;recognition.onresult=e=>{$("prompt").value+=($("prompt").value?" ":"")+e.results[0][0].transcript};recognition.onerror=()=>toast("Spracheingabe konnte nicht gestartet werden.");recognition.onend=()=>{recognition=null};recognition.start();toast("Ich höre zu …")}
$("sendBtn").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{const t=$("prompt");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,150)+"px"});$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{pendingFiles=pendingFiles.concat(Array.from(e.target.files));toast(pendingFiles.length+" Datei(en) angehängt.");e.target.value=""};$("voiceBtn").onclick=startVoice;$("recordBtn").onclick=toggleRecording;$("settingsBtn").addEventListener("click",e=>{e.preventDefault();try{openSettings("providers")}catch(err){console.error("Xtree Einstellungen:",err);toast("Einstellungen konnten nicht geladen werden: "+(err&&err.message?err.message:"Unbekannter Fehler"))}});$("historyBtn").onclick=openHistory;$("toolsBtn").onclick=openTools;$("closePanel").onclick=closePanel;$("panel").addEventListener("click",e=>{if(e.target===$("panel"))closePanel()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
